[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "applescript-decompiler"
version = "1.0.0"
description = "Decompiler for compiled AppleScript (.scpt) files"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
keywords = ["applescript", "decompiler", "scpt", "reverse-engineering", "macos"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Disassemblers",
]

[project.urls]
Repository = "https://github.com/n0kovo/applescript-decompiler"

[project.scripts]
asdec = "applescript_decompiler.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "rope>=1.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/applescript_decompiler"]

[tool.pyright]
extraPaths = ["src"]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.rope.imports]
preferred_import_style = "from-global"
